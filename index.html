<style>
:root{
  --bone:#F2EFEA; --greige:#D9D3CB; --milk:#FBFAF7; --graphite:#1E1C1A; --cherry:#6B1E2A;
  --serif:"DM L","Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --mono:"PT Mono",ui-monospace,Menlo,monospace;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pad:40px; --bar:44px; --head:64px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--graphite)}
html.js{overflow:hidden;scrollbar-gutter:stable}
html.redir body{display:none}
body{margin:0;background:var(--graphite);color:var(--graphite);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,p,figure{margin:0}
:focus-visible{outline:2px solid var(--cherry);outline-offset:3px;border-radius:2px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ================= ПЕРЕХОД НА СТРАНИЦЫ =================
   Последний кадр раскрытия = первый экран страницы: фото и слово раскрытой половины получают те же имена,
   что и на странице, поэтому смена документа идёт без вспышки и без прыжка */
@media (prefers-reduced-motion:no-preference){@view-transition{navigation:auto}}
html[data-open="manikur"] .half-m .hero-media,html[data-open="obuchenie"] .half-o .hero-media{view-transition-name:hero-photo}
html[data-open="manikur"] .half-m .word,html[data-open="obuchenie"] .half-o .word{view-transition-name:hero-word}
/* строка и плашка частью лежат поверх фото. Без своих имён переход рисует их под снимком фото, и хвост строки пропадает —
   поэтому они тоже отдельными снимками, поверх фото */
html[data-open="manikur"] .half-m .line,html[data-open="obuchenie"] .half-o .line{view-transition-name:hero-line}
html[data-open="manikur"] .half-m .bar-ghost,html[data-open="obuchenie"] .half-o .bar-ghost{view-transition-name:hero-bar}
/* возвращение со страницы (переход рисует развилка): строка и плашка развилки встают сразу, без проявления —
   поверх такой же строки уходящей страницы это незаметно */
::view-transition-new(hero-line):only-child,::view-transition-new(hero-bar):only-child{animation:none}

/* ---------- глянец в буквах (как на страницах) ---------- */
.gl{color:var(--graphite)}
.gl-o{color:#D2C9BF}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .gl{
    background-image:linear-gradient(100deg,#1E1C1A 0%,#1E1C1A 43%,#6E645D 47%,#D8CEC4 49.4%,#EFE8E0 50%,#D8CEC4 50.6%,#6E645D 53%,#1E1C1A 57%,#1E1C1A 100%);
    background-size:300% 100%;background-position:100% 0;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    animation:sheen 8s cubic-bezier(.45,.05,.3,1) 1.2s infinite;
  }
  /* «Обучение» — молочный блик, как на странице для мастеров */
  .gl.gl-o{background-image:linear-gradient(100deg,#D2C9BF 0%,#D2C9BF 43%,#E6DFD7 46%,#FFFFFF 48.8%,#FFFFFF 51.2%,#E6DFD7 54%,#D2C9BF 57%,#D2C9BF 100%)}
}
@keyframes sheen{0%{background-position:100% 0}36%{background-position:0% 0}100%{background-position:0% 0}}

/* ---------- печать ---------- */
.seal{display:block;color:var(--graphite)}
.seal text{font:500 10.4px var(--sans);letter-spacing:1.5px}

/* ---------- знак и метки половин ---------- */
.fork-brand{display:flex;align-items:center;height:36px;padding:0 18px;border-radius:999px;background:var(--milk);color:var(--graphite);
  font:400 12px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;pointer-events:none}
.meta{display:inline-flex;align-items:center;gap:14px;height:48px;padding:0 7px 0 20px;border-radius:999px;
  font:400 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.half-m .meta{background:var(--milk);color:var(--graphite)}
.half-o .meta{background:var(--graphite);color:var(--milk);box-shadow:inset 0 0 0 1px rgba(251,250,247,.3)}
.arr{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--graphite);color:var(--milk);font:400 16px/1 var(--sans);letter-spacing:0;transition:transform .4s var(--ease)}
.half-o .arr{background:var(--milk);color:var(--graphite)}
.half:hover .arr,.half:focus-visible .arr{transform:translateX(3px)}
.half{outline:none;-webkit-tap-highlight-color:transparent}
.half:focus-visible .meta{outline:2px solid var(--cherry);outline-offset:4px}
.half-o:focus-visible .meta{outline-color:var(--milk)}
.line i{font-style:normal;color:var(--cherry)}
.half-m .stage,.half-m .hero{background:var(--bone)}
.half-o .stage,.half-o .hero{background:var(--graphite)}
.half-o .line{color:var(--milk)}
.hero-media{margin:0;overflow:hidden}
.hero-media picture{display:block;width:100%;height:100%}
.hero-media img{width:100%;height:100%;object-fit:cover}
/* подложка поверх фото (на странице — ::after): край и низ растворяются в графите */
.shade{display:none;position:absolute;inset:0;z-index:1;pointer-events:none}
.half-o .shade{display:block;
  background:linear-gradient(to right,#1E1C1A 0%,rgba(30,28,26,.92) 9%,rgba(30,28,26,.55) 24%,rgba(30,28,26,.12) 40%,rgba(30,28,26,0) 52%),
             linear-gradient(to bottom,rgba(30,28,26,0) 58%,rgba(30,28,26,.55) 80%,#1E1C1A 100%)}

/* ================= БЕЗ JS: простая развилка из двух ссылок ================= */
html:not(.js) .fork{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:100vh;min-height:100svh}
html:not(.js) .fork-brand{position:absolute;top:22px;left:50%;transform:translateX(-50%);z-index:3}
html:not(.js) .half{position:relative;display:block;overflow:hidden;min-height:420px;text-decoration:none;color:inherit}
html:not(.js) .stage,html:not(.js) .hero,html:not(.js) .hero-media{position:absolute;inset:0}
html:not(.js) .gloss,html:not(.js) .seal--hero,html:not(.js) .veil,html:not(.js) .bar-ghost,html:not(.js) .copy-sp,html:not(.js) .fork-seal,html:not(.js) .hero-sheen{display:none}
html:not(.js) .half-o .shade{background:linear-gradient(to bottom,rgba(30,28,26,0) 38%,rgba(30,28,26,.62) 66%,#1E1C1A 100%)}
html:not(.js) .half-o .hero-media img{object-position:50% 70%}
html:not(.js) .hero-inner{position:absolute;z-index:2;left:0;right:0;bottom:104px;padding:0 var(--pad)}
html:not(.js) .word{width:fit-content;font:300 clamp(56px,8.4vw,150px)/.9 var(--serif);letter-spacing:-.015em;padding:.06em .05em .2em;margin:-.06em -.05em -.2em -.08em}
html:not(.js) .line{margin-top:.2em;font:italic 300 clamp(22px,2.6vw,42px)/1.1 var(--serif)}
html:not(.js) .meta{position:absolute;z-index:3;left:var(--pad);bottom:36px}

/* ================= С JS: две половины одного экрана ================= */
/* половина — ссылка на весь экран, обрезанная clip-path; внутри «сцена» = первый экран страницы ветки */
html.js .half{position:fixed;inset:0;z-index:1;display:block;overflow:hidden;text-decoration:none;color:inherit;cursor:pointer}
html.js .half-m{clip-path:inset(0% 50% 0% 0%)}
html.js .half-o{clip-path:inset(0% 0% 0% 50%)}
html.js .half.is-top{z-index:2}
html.js .stage{position:absolute;inset:0;overflow:hidden}
html.js:not(.posed):not([data-open]) .stage,html.js:not(.posed):not([data-open]) .meta{visibility:hidden}
html.js .veil{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0}
html.js .half-m .veil{background:var(--bone)}
html.js .half-o .veil{background:var(--graphite)}
html.js .meta{position:absolute;left:0;top:0;z-index:6}
html.js .fork-brand{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:8}
.fork-seal{display:none}
html.js .fork-seal{display:block;position:fixed;left:0;top:0;width:120px;height:120px;z-index:7;pointer-events:none;transform-origin:50% 50%;
  filter:drop-shadow(0 10px 24px rgba(30,28,26,.22))}
/* в покое печати фото спрятаны — на шве лежит своя; в раскрытом кадре наоборот */
html.js:not([data-open]) .seal--hero{opacity:0}
html[data-open] .fork-seal,html[data-open] .fork-brand,html[data-open] .meta{opacity:0}
html[data-open="manikur"] .half-m,html[data-open="obuchenie"] .half-o{clip-path:inset(0% 0% 0% 0%);z-index:2}
html[data-open="manikur"] .half-o,html[data-open="obuchenie"] .half-m{visibility:hidden}
/* плашка записи внизу страницы (там, где она видна на первом экране) — выезжает к концу раскрытия */
.bar-ghost{display:none}
html.js .bar-ghost{position:absolute;left:0;right:0;bottom:0;height:var(--bar);z-index:4;background:var(--greige);transform:translateY(110%)}
html[data-open="manikur"] .half-m .bar-ghost,html[data-open="obuchenie"] .half-o .bar-ghost{transform:none}

/* ---------- сцена «Маникюр» = первый экран manikur/ (те же правила, те же брейкпоинты) ---------- */
html.js .half-m .hero{position:relative;min-height:max(640px,min(100svh,900px))}

          document.body.appendChild(f);
          (function poll() {
            var d = null;
            try { d = f.contentDocument; } catch (_) {}
            if (d && d.URL === 'about:srcdoc' && d.readyState !== 'loading' && d.body) {
              void d.body.offsetWidth;
              (d.fonts ? d.fonts.ready : Promise.resolve()).then(function () {
                requestAnimationFrame(function () {
                  var c = null;
                  try { c = readPage(d); } catch (_) {}
                  f.remove(); done(c);
                });
              });
            } else if (Date.now() - t0 > 6000) { f.remove(); done(null); }
            else setTimeout(poll, 40);
          })();
        })
        .catch(function () { done(null); });
    });
  }
  function useCal(b, c) {
    if (!c) return;
    store(b, c);
    if (run || isOpen()) { pendingCal[b] = c; return; }
    applyCal(b, c); applyFork(hover || 'rest');
  }
  function flushCal() { B.forEach(function (b) { if (pendingCal[b]) { applyCal(b, pendingCal[b]); delete pendingCal[b]; } }); }
  function calibrateAll() {
    if (reduce || (navigator.connection && navigator.connection.saveData)) return;
    calibrate('manikur').then(function (c) { useCal('manikur', c); return calibrate('obuchenie'); })
      .then(function (c) { useCal('obuchenie', c); });
  }
  function scheduleCal(ms) {
    clearTimeout(calTimer);
    calTimer = setTimeout(function () {
      if (window.requestIdleCallback) requestIdleCallback(calibrateAll, { timeout: 1500 }); else calibrateAll();
    }, ms);
  }

  /* ---------- размеры ---------- */
  var rt;
  function onResize() {
    clearTimeout(rt);
    rt = setTimeout(function () {
      if (run || isOpen()) return;
      B.forEach(function (b) { applyCal(b, stored(b)); });
      applyFork(hover || 'rest');
      scheduleCal(400);
    }, 120);
  }
  window.addEventListener('resize', onResize);
  mqStack.addEventListener && mqStack.addEventListener('change', onResize);

  /* ---------- печать слов по буквам с кареткой (обе половины сразу) ---------- */
  var typing = false;
  function typeWord(word, done) {
    var chars = word.querySelectorAll('.ch'), caret = word.querySelector('.caret'), i = 0;
    function place(n) {
      var x = n ? chars[n - 1].offsetLeft + chars[n - 1].offsetWidth + 4 : chars[0].offsetLeft;
      caret.style.transform = 'translate3d(' + x + 'px,0,0)';
    }
    place(0); caret.style.opacity = '1';
    (function step() {
      if (!typing) return;
      chars[i].style.visibility = 'visible'; i++; place(i);
      if (i < chars.length) setTimeout(step, 82);
      else {
        caret.classList.add('blink');
        setTimeout(function () { caret.style.opacity = '0'; done(); }, 540);
      }
    })();
  }
  function finishType() {
    if (!typing && !root.classList.contains('js-type')) return;
    typing = false; clearTimeout(window.__typeSafety);
    root.classList.remove('js-type');
    $$('.word .ch').forEach(function (c) { c.style.visibility = ''; });
    $$('.caret').forEach(function (c) { c.style.opacity = '0'; c.classList.remove('blink'); });
  }
  function startType() {
    if (!isOpen() && !run) applyFork(hover || 'rest');
    if (!root.classList.contains('js-type')) return;
    clearTimeout(window.__typeSafety);
    window.__typeSafety = setTimeout(finishType, 2200);
    typing = true;
    var left = 2;
    B.forEach(function (b) { typeWord(L[b].word, function () { if (!--left) finishType(); }); });
  }

  /* ---------- первый показ ---------- */
  B.forEach(function (b) { applyCal(b, stored(b)); });
  var opened = root.getAttribute('data-open');
  if (!opened) applyFork('rest');
  var fontsIn = document.fonts && document.fonts.load
    ? Promise.race([
        Promise.all([document.fonts.load('300 100px "Cormorant Garamond"', 'МаникюрОбучение'), document.fonts.load('italic 300 40px "Cormorant Garamond"', 'тонко')]),
        new Promise(function (r) { setTimeout(r, opened ? 900 : 420); })
      ])
    : Promise.resolve();
  fontsIn.then(function () {
    if (opened) afterReveal(function () { if (root.getAttribute('data-open') === opened) collapse(opened); });
    else setTimeout(startType, 40);
  }, function () {});
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (!run && !isOpen()) applyFork(hover || 'rest'); });
  scheduleCal(1600);

  /* ---------- блик по гелю на макро (как на странице «Маникюр») ---------- */
  var glossHome = false;             /* к концу раскрытия блик встаёт туда, откуда начинает страница */
  (function () {
    var x0 = L.manikur, fig = x0.photo;
    var sheen = $('.gloss-sheen', fig), streaks = $$('.gloss-streak', fig);
    var W = 0, H = 0, SW = 0, TW = 0, TW2 = 0;
    function meas() { W = fig.offsetWidth; H = fig.offsetHeight; SW = sheen.offsetWidth; TW = streaks[0].offsetWidth; TW2 = streaks[1].offsetWidth; }
    var x = .63, y = .4, tx = x, ty = y, over = false, touchUntil = 0;
    function apply() {
      sheen.style.transform = 'translate3d(' + (x * W - SW / 2).toFixed(1) + 'px,' + (y * H - SW / 2).toFixed(1) + 'px,0)';
      var rot = (8 + (x - .5) * 16).toFixed(2);
      streaks[0].style.transform = 'translate3d(' + (x * W - TW / 2).toFixed(1) + 'px,0,0) rotate(' + rot + 'deg)';
      streaks[1].style.transform = 'translate3d(' + (x * W + W * .075 - TW2 / 2).toFixed(1) + 'px,0,0) rotate(' + rot + 'deg)';
    }
    meas(); apply();
    window.addEventListener('resize', function () { meas(); apply(); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { meas(); apply(); });
    if (reduce) return;
    function onMove(e) {
      if (e.pointerType !== 'mouse') return;
      var r = fig.getBoundingClientRect();
      over = true;
      tx = Math.max(-.15, Math.min(1.15, (e.clientX - r.left) / r.width)); ty = Math.max(-.1, Math.min(1.1, (e.clientY - r.top) / r.height));
    }
    x0.el.addEventListener('pointermove', onMove, { passive: true });
    x0.el.addEventListener('pointerleave', function () { over = false; });
    fig.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse') return;
      var r = fig.getBoundingClientRect();
      tx = (e.clientX - r.left) / r.width; ty = (e.clientY - r.top) / r.height; touchUntil = performance.now() + 1600;
    }, { passive: true });
    var raf = 0, t0 = performance.now();
    function tick(now) {
      raf = 0;
      var k;
      if (glossHome) { tx = .63; ty = .4; k = .16; }
      else {
        if (!over && now > touchUntil) {
          var s = (now - t0) / 1000;
          tx = .56 + .3 * Math.sin(s * .52) + .06 * Math.sin(s * 1.37);
          ty = .42 + .14 * Math.sin(s * .41 + 1.1);
        }
        k = over ? .085 : .05;
      }
      x += (tx - x) * k; y += (ty - y) * k;
      if (glossHome && Math.abs(tx - x) < .001 && Math.abs(ty - y) < .001) { x = tx; y = ty; }
      apply();
      if (!document.hidden) raf = requestAnimationFrame(tick);
    }
    function runT() { if (!raf && !document.hidden) raf = requestAnimationFrame(tick); }
    document.addEventListener('visibilitychange', runT);
    window.addEventListener('pageshow', runT);
    document.addEventListener('click', function () { setTimeout(runT, 50); });
    runT();
  })();

  /* служебное для проверки роликами */
  window.__fork = {
    open: open,
    hold: function (b) {             /* последний кадр раскрытия без перехода */
      stopRun(); finishType(); applyFork('rest');
      var X = L[b];
      X.el.classList.add('is-top'); X.el.style.clipPath = 'inset(0% 0% 0% 0%)';
      X.title.style.transform = X.photo.style.transform = 'translate(0px, 0px) scale(1)';
      glossHome = b === 'manikur';
      root.setAttribute('data-open', b);
    },
    calibrate: function () { return Promise.all(B.map(function (b) { return calibrate(b).then(function (c) { useCal(b, c); return c; }); })); },
    get cal() { return CAL; },
    get running() { return run ? run.kind : null; }
  };
})();
</script>
</body>
